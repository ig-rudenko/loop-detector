[project]
name = "web-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "uvicorn>=0.52.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C", # mccabe
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "RSE", # flake8-raise
    "UP", # pyupgrade
    "W", # pycodestyle
]
ignore = [
    "C408", # Unnecessary collection call
    "C901", # Functions with a high complexity
    "E402", # Module level import not at top of file
    "E501", # Line too long
    "SIM108", # Use ternary operator instead of `if`-`else`-block
    "W291", # Trailing whitespace
    "W293", # Blank line contains whitespace
]

[tool.black]
line-length = 110
target-version = ["py314"]
